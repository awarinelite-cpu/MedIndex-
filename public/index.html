<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ── PWA / Theme ──────────────────────────────────────────── -->
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="background-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MedIndex" />
    <meta name="application-name" content="MedIndex" />
    <meta name="msapplication-TileColor" content="#1e3a8a" />

    <!-- ── SEO / Description ────────────────────────────────────── -->
    <meta name="description" content="MedIndex — Nigerian clinical drug reference. 280 medications with dosages, interactions, nursing considerations. Works offline." />
    <meta name="keywords" content="drug reference, Nigerian medications, clinical pharmacology, nursing, dosage, interactions" />
    <meta name="author" content="MedIndex" />

    <!-- ── Open Graph ───────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MedIndex — Drug Reference" />
    <meta property="og:description" content="280 Nigerian clinical medications — dosages, interactions, nursing considerations. Works offline." />
    <meta property="og:image" content="/icon-512x512.svg" />

    <!-- ── Apple touch icons ────────────────────────────────────── -->
    <link rel="apple-touch-icon" href="/icon-192x192.svg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152x152.svg" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icon-144x144.svg" />

    <!-- ── Manifest ──────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Favicon ──────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/icon-96x96.svg" />

    <!-- ── Fonts ─────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ── Safe area for notched phones ────────────────────────── -->
    <style>
      body {
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>

    <title>MedIndex — Drug Reference</title>
  </head>
  <body>
    <noscript>MedIndex requires JavaScript. Please enable it in your browser settings.</noscript>
    <div id="root"></div>
      <script>
      // If the app has not drawn anything after 8s, show why instead of a blank page.
      (function () {
        var last = '';
        window.addEventListener('error', function (e) { last = (e && e.message) || last; });
        window.addEventListener('unhandledrejection', function (e) { last = String((e && e.reason && (e.reason.message || e.reason)) || last); });
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.firstChild) {
            r.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#0b2a66"><h2 style="margin:0 0 8px">MedIndex could not start</h2><p style="margin:0 0 12px;font-size:14px">Try reloading. If it keeps happening, send this message to support:</p><code style="display:block;font-size:12px;word-break:break-word;background:#eef4ff;padding:10px;border-radius:8px">' + (last || 'No error was reported (the app script may not have loaded).').replace(/</g, '&lt;') + '</code><button onclick="location.reload()" style="margin-top:14px;padding:10px 18px;border:0;border-radius:20px;background:#1769e0;color:#fff;font-size:14px">Reload</button></div>';
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
